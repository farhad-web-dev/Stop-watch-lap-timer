<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChronoPulse | Dev Stopwatch & Lap Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #080711;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fullscreen-wrapper {
            width: 100%;
            height: 100%;
            max-width: 500px;
            background: rgba(18, 15, 36, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 24px;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
            position: relative;
        }

        @media (min-width: 501px) {
            .fullscreen-wrapper {
                height: 92vh;
                border-radius: 32px;
                border: 1px solid rgba(0, 243, 255, 0.3);
            }
        }

        .header {
            text-align: center;
            padding-top: 10px;
        }

        .title {
            font-size: 1.1rem;
            color: #ff007f;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #00f3ff;
            opacity: 0.8;
            margin-top: 4px;
        }

        .display-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .display {
            font-size: 4rem;
            font-weight: 900;
            font-family: 'Courier New', Courier, monospace;
            color: #00f3ff;
            text-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
            letter-spacing: 2px;
        }

        .btn-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 16px 0;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-start {
            background: #00f3ff;
            color: #080711;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .btn-pause {
            background: #ffb703;
            color: #080711;
            box-shadow: 0 0 20px rgba(255, 183, 3, 0.4);
        }

        .btn-lap {
            background: rgba(255, 0, 127, 0.1);
            color: #ff007f;
            border: 2px solid #ff007f;
        }

        .btn-reset {
            background: transparent;
            color: #64748b;
            border: 2px solid #334155;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .laps-container {
            flex: 1;
            max-height: 40vh;
            overflow-y: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            margin-bottom: 15px;
        }

        .laps-container::-webkit-scrollbar {
            width: 4px;
        }

        .laps-container::-webkit-scrollbar-thumb {
            background: #00f3ff;
            border-radius: 10px;
        }

        .lap-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Courier New', Courier, monospace;
            border-left: 3px solid #ff007f;
        }

        .lap-title {
            color: #ff007f;
            font-weight: 600;
        }

        .lap-time {
            color: #00f3ff;
            font-weight: 700;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="fullscreen-wrapper">
        <div class="header">
            <div class="title">PROJECT 20</div>
            <div class="subtitle">ChronoPulse Stopwatch & Lap Timer</div>
        </div>

        <div class="display-container">
            <div class="display" id="display">00:00.00</div>
        </div>

        <div class="btn-group">
            <button class="btn btn-start" id="startBtn" onclick="start()">Start</button>
            <button class="btn btn-lap" id="lapBtn" onclick="recordLap()" disabled>Lap</button>
            <button class="btn btn-reset" id="resetBtn" onclick="reset()" disabled>Reset</button>
        </div>

        <div class="laps-container" id="lapsList">
            <!-- Laps list render yahan hoga -->
        </div>

        <footer>© 2026 Farhad | 20 of 30 Projects Done</footer>
    </div>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval;
        let isRunning = false;
        let lapCount = 0;

        const display = document.getElementById('display');
        const startBtn = document.getElementById('startBtn');
        const lapBtn = document.getElementById('lapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const lapsList = document.getElementById('lapsList');

        function formatTime(time) {
            let date = new Date(time);
            let minutes = String(date.getUTCMinutes()).padStart(2, '0');
            let seconds = String(date.getUTCSeconds()).padStart(2, '0');
            let milliseconds = String(Math.floor(date.getUTCMilliseconds() / 10)).padStart(2, '0');
            return `${minutes}:${seconds}.${milliseconds}`;
        }

        function updateDisplay() {
            elapsedTime = Date.now() - startTime;
            display.textContent = formatTime(elapsedTime);
        }

        function start() {
            if (!isRunning) {
                isRunning = true;
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(updateDisplay, 10);

                startBtn.textContent = 'Pause';
                startBtn.className = 'btn btn-pause';
                lapBtn.disabled = false;
                resetBtn.disabled = false;
            } else {
                isRunning = false;
                clearInterval(timerInterval);

                startBtn.textContent = 'Start';
                startBtn.className = 'btn btn-start';
                lapBtn.disabled = true;
            }
        }

        function reset() {
            isRunning = false;
            clearInterval(timerInterval);
            elapsedTime = 0;
            lapCount = 0;

            display.textContent = '00:00.00';
            lapsList.innerHTML = '';

            startBtn.textContent = 'Start';
            startBtn.className = 'btn btn-start';
            lapBtn.disabled = true;
            resetBtn.disabled = true;
        }

        function recordLap() {
            if (isRunning) {
                lapCount++;
                const lapTimeFormatted = formatTime(elapsedTime);

                const lapRow = document.createElement('div');
                lapRow.className = 'lap-row';
                lapRow.innerHTML = `
                    <span class="lap-title">Lap ${lapCount}</span>
                    <span class="lap-time">${lapTimeFormatted}</span>
                `;

                lapsList.prepend(lapRow);
            }
        }
    </script>
</body>
</html>
